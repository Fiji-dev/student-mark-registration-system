<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mark Registration System{% endblock %}</title>

    <!-- Bootstrap CDN for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- Additional CSS for footer, animated background, and button style -->
    <style>
        /* General styling */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(45deg, #34ebba, #1e90ff);
            background-size: 400% 400%;
            animation: gradient-animation 10s ease infinite;
            color: white;
            font-family: 'Poppins', sans-serif;
        }

        /* Keyframes for background animation */
        @keyframes gradient-animation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        main {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.2);
            color: black;
            padding: 20px;
        }

        footer {
            position: relative;
            background-color: #343a40;
            color: white;
            padding: 10px 0;
            box-shadow: 0px -2px 10px rgba(0, 0, 0, 0.2);
        }

        /* Navbar-toggler button style */
        .navbar-toggler {
            border-radius: 50px;
            background-color: #34ebba;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .navbar-toggler:hover {
            transform: scale(1.05);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.3);
        }

        .navbar-toggler:active {
            transform: translateY(2px);
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.2);
        }

        /* Button Styles for Nav Links */
        .nav-link {
            border-radius: 50px;
            color: white;
            padding: 10px 20px;
            margin: 5px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease, background 0.3s ease;
            font-weight: 600;
        }

        .nav-link:hover {
            transform: scale(1.1);
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3);
            background: linear-gradient(to bottom, #ffffff, #e0e0e0);
            color: black;
        }

        .nav-link:active {
            transform: translateY(2px);
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.2);
            background: linear-gradient(to bottom, #d9d9d9, #c2c2c2);
            color: black;
        }
    </style>
</head>
<body>
    <!-- Header section -->
    <header class="bg-primary text-white text-center py-4">
        <h1>Mark Registration System</h1>
    </header>

    <!-- Navigation bar with centered links -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(45deg, #34a69a, #1e90ff);">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                Menu
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'input_mark' %}">Input Marks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'update_mark' %}">Update Marks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'view_marks' %}">View Marks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'visualization' %}">Visualization</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content area -->
    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer section at the bottom -->
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2024 Mark Registration System. All rights reserved.</p>
    </footer>

    <!-- External JavaScript -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
    <script>
        $(document).ready(function() {
            $('table').DataTable();
        });
    </script>
</body>
</html>
